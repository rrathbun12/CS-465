<div class="row justify-content-center mt-4">

  <div class="col-12 col-md-6 col-lg-4">

    <h2 class="text-center mb-4">
      Login
    </h2>

    @if (formError) {
      <div class="alert alert-danger">
        {{ formError }}
      </div>
    }

    <form (ngSubmit)="onLoginSubmit()">

      <div class="mb-3">
        <label
          for="name"
          class="form-label">
          Name
        </label>

        <input
          type="text"
          id="name"
          name="name"
          class="form-control"
          [(ngModel)]="credentials.name">
      </div>

      <div class="mb-3">
        <label
          for="email"
          class="form-label">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          [(ngModel)]="credentials.email">
      </div>

      <div class="mb-3">
        <label
          for="password"
          class="form-label">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          [(ngModel)]="credentials.password">
      </div>

      <button
        type="submit"
        class="btn btn-info">
        Sign In!
      </button>

    </form>

  </div>

</div>
